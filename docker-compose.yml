services:
  app:
    build: .
    container_name: "pscpt-${ALVA_ENV:-staging}-app"
    ports:
      - "${PSCPT_HOST_BIND:-127.0.0.1}:${PSCPT_HOST_PORT:-8091}:8080"
    env_file:
      - ../../../secrets/${ALVA_ENV:-staging}/pscpt.env
      - ../../../secrets/${ALVA_ENV:-staging}/emica.env
    environment:
      PSCPT_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    container_name: "pscpt-${ALVA_ENV:-staging}-db"
    ports:
      - "${PSCPT_DB_HOST_BIND:-127.0.0.1}:${PSCPT_DB_HOST_PORT:-3308}:3306"
    env_file:
      - ../../../secrets/${ALVA_ENV:-staging}/pscpt.env
    environment:
      MYSQL_DATABASE: pscpt
      MYSQL_USER: pscpt
    volumes:
      - pscpt_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pscpt_mysql:
