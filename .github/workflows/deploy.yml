name: Deploy

on:
  push:
    branches: [main]
    tags: ['prod-*']

permissions:
  contents: read

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: pscpt-staging
      cancel-in-progress: true
    steps:
      - name: Deploy immutable main SHA
        env:
          DEPLOY_HOST: ${{ secrets.PSCPT_STAGING_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PSCPT_STAGING_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PSCPT_STAGING_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.PSCPT_STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "PSCPT_DEPLOY_ENV=staging PSCPT_APP_DIR=/opt/alva/apps/staging/pscpt PSCPT_DEPLOY_REF='$DEPLOY_SHA' /opt/alva/apps/staging/pscpt/scripts/deploy.sh"

  production:
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pscpt-production
      cancel-in-progress: false
    steps:
      - name: Validate immutable release tag
        env:
          DEPLOY_TAG: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TAG" =~ ^prod-[0-9]{4}-[0-9]{2}-[0-9]{2}-[1-9][0-9]*$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Deploy approved immutable tag and SHA
        env:
          DEPLOY_HOST: ${{ secrets.PSCPT_PROD_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PSCPT_PROD_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PSCPT_PROD_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.PSCPT_PROD_DEPLOY_SSH_KEY }}
          DEPLOY_TAG: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "PSCPT_DEPLOY_ENV=prod PSCPT_APP_DIR=/opt/alva/apps/prod/pscpt PSCPT_DEPLOY_REF='$DEPLOY_SHA' PSCPT_DEPLOY_TAG='$DEPLOY_TAG' /opt/alva/apps/prod/pscpt/scripts/deploy.sh"
