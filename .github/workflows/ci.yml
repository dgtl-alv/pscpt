name: PR validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          go test ./...
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          PSCPT_DSN='user:required-secret@tcp(db:3306)/pscpt?parseTime=true&multiStatements=true' \
          PSCPT_SESSION_SECRET='required-secret' MYSQL_PASSWORD='required-secret' \
          MYSQL_ROOT_PASSWORD='required-secret' docker compose config --quiet
          git diff --check
